name: Fluvel Set Python wheels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fluvel-wheels
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [release]

jobs:

  # Wheels are built only if something that goes into them changed since the
  # commit of the "latest-python" tag (moved when the wheels are published), or
  # if the "latest-python" release does not exist.
  changes:
    runs-on: ubuntu-latest

    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(RELEASE=latest-python .github/scripts/changed-since.sh refs/tags/latest-python \
            src/image_processing src/bindings cmake CMakeLists.txt \
            pyproject.toml tests/python .github/workflows/wheels.yml)

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'

    name: Wheels (${{ matrix.platform }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux }
          - { os: windows-2022, platform: windows }
          - { os: macos-15, platform: macos }

    steps:

      - uses: actions/checkout@v4

      # Builds one wheel per Python version, then installs each one in a clean
      # environment and runs the tests on it (test-command in pyproject.toml).
      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v3.2.1

      - name: Generate checksums
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" .github/scripts/wheel-checksums.py wheelhouse

      - name: Generate commit info
        shell: bash
        run: printf '%s' "${GITHUB_SHA}" > wheelhouse/commit-wheels-${{ matrix.platform }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: |
            wheelhouse/*.whl
            wheelhouse/*.whl.sha256
            wheelhouse/commit-wheels-${{ matrix.platform }}.txt

  # Verifies the wheels and attaches them, with their bill, to the
  # "latest-python" release. It has its own tag, moved to the commit the wheels
  # were built from, so that the source archives of the release match the
  # wheels. The applications keep their own "latest" release.
  publish-latest:
    needs: build

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Debug files
        run: ls -R wheelhouse

      - name: Verify wheels
        run: .github/scripts/verify-wheels.sh

      - name: Generate BUILD_INFO-python.txt
        run: .github/scripts/generate-wheels-build-info.sh

      - name: Show BUILD_INFO-python.txt
        run: cat BUILD_INFO-python.txt

      - name: Update latest-python tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag -f latest-python "$GITHUB_SHA"
          git push origin latest-python --force

      # Development builds are pre-releases: the "Latest" badge is kept for
      # stable versions.
      - name: Ensure the release exists
        run: |
          gh release view latest-python --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest-python --repo "$GITHUB_REPOSITORY" \
              --title "Fluvel Set Python Wheels (development build)" \
              --notes "Python wheels of the development version. Desktop applications: see the latest release." \
              --target "$GITHUB_SHA" --prerelease

      - name: Upload wheels and bill
        run: |
          gh release upload latest-python wheelhouse/*.whl BUILD_INFO-python.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The bill must describe exactly the wheels of the release: remove the
      # wheels of previous builds that are not part of this one.
      - name: Remove stale wheels
        run: |
          ls wheelhouse/*.whl | xargs -n1 basename | sort > current.txt

          gh release view latest-python --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name | select(endswith(".whl"))' | sort > published.txt

          comm -13 current.txt published.txt | while read -r stale
          do
            echo "Removing stale asset: $stale"
            gh release delete-asset latest-python "$stale" --repo "$GITHUB_REPOSITORY" --yes
          done
