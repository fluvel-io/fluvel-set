name: Test bindings

# Fast check of the image processing library through its Python bindings.
# Built in Debug so that the asserts of the library are enabled.
#
# Not run on main nor on the latest builds: run scripts/test_bindings.sh
# locally when needed. The wheels workflow runs the same tests before
# publishing the wheels. It is called by the stable workflow, where a failing
# test blocks the publication. It can also be started by hand.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python bindings tests (Debug)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install pybind11 numpy pytest

      - name: Configure
        run: |
          cmake -S . -B build-bindings -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLUVEL_BUILD_APP=OFF \
            -DFLUVEL_BUILD_BIND=ON \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build
        run: cmake --build build-bindings

      - name: Run tests
        run: PYTHONPATH=build-bindings/python python -m pytest tests/python -q
