name: Fluvel Set Latest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fluvel-latest
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [release]

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.build }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web }}

    steps:

      # The full history and the tags are needed to compare with the last
      # published build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # build: something that goes into the applications changed since the
      # commit of the "latest" tag (moved by the release job, so it is the last
      # published build), or the "latest" release does not exist.
      # web: the web pages changed in this push.
      - name: Detect changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(RELEASE=latest .github/scripts/changed-since.sh refs/tags/latest \
            src resources packaging cmake CMakeLists.txt \
            .github/workflows/build-desktop.yml \
            .github/workflows/build-linux.yml \
            .github/workflows/latest.yml)

          WEB=$(.github/scripts/changed-since.sh "${{ github.event.before }}" \
            web assets)

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"


  desktop:
    needs: changes
    if: needs.changes.outputs.build == 'true'

    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit


  linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'

    uses: ./.github/workflows/build-linux.yml
    secrets: inherit


  prepare:
    needs: [desktop, linux]

    uses: ./.github/workflows/prepare-release.yml
    secrets: inherit


  # The binding tests block the publication of the release.
  tests:
    needs: changes
    if: needs.changes.outputs.build == 'true'

    uses: ./.github/workflows/test-bindings.yml


  release:
    needs: [prepare, tests]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: linux

      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak
          path: linux

      - uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: prepared

      - name: Update latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git tag -f latest ${{ github.sha }}
          git push origin latest --force

      - name: Install gh
        run: |
          command -v gh || (apt update && apt install -y gh)

      # =========================
      # CREATE OR UPDATE RELEASE
      # Development builds are pre-releases: the "Latest" badge is kept for
      # stable versions.
      # =========================
      - name: Ensure release exists and is published
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "Release exists"

            gh release edit latest \
              --draft=false \
              --prerelease

          else
            echo "Creating release"

            gh release create latest \
              --title "Fluvel Set Applications (development build)" \
              --notes "Desktop applications of the development version. Python wheels: see the latest-python release." \
              --target "${{ github.sha }}" \
              --prerelease \
              --draft=false
          fi

          gh release view latest --json isDraft,url

      # =========================
      # UPLOAD ASSETS (ATOMIC)
      # =========================
      - name: Upload assets
        run: |
          gh release upload latest \
            windows/FluvelSet-win64-portable.zip \
            windows/FluvelSet-win64-installer.exe \
            macos/FluvelSet-macos.dmg \
            linux/FluvelSet-linux.AppImage \
            linux/FluvelSet-linux.flatpak \
            prepared/BUILD_INFO.txt \
            --clobber

  deploy:
    needs: [changes, prepare, release]

    # With a build: deploy only if the whole chain succeeded.
    # Without a build: deploy only if the web content changed.
    if: |
      always() &&
      needs.prepare.result != 'failure' &&
      needs.release.result != 'failure' &&
      (
        (
          needs.changes.outputs.build == 'true' &&
          needs.release.result == 'success'
        ) ||
        (
          needs.changes.outputs.build != 'true' &&
          needs.changes.outputs.web == 'true'
        )
      )

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      # =========================
      # DOWNLOAD RELEASE METADATA
      # =========================

      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.build == 'true'
        with:
          name: prepared-release
          path: prepared

      # =========================
      # DEPLOY GITHUB PAGES
      # =========================

      - name: Deploy GitHub Pages
        run: |

          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
          cd gh-pages

          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout -b gh-pages

          # web/latest.json is a demo file for local testing only:
          # keep the published one when no build was made.
          if [ "${{ needs.changes.outputs.build }}" != "true" ]; then
            cp latest.json /tmp/latest.json.keep 2>/dev/null || true
          fi

          cp -r ../web/* .

          rm -rf media
          rm -rf assets

          cp -r ../assets ./assets

          if [ "${{ needs.changes.outputs.build }}" = "true" ]; then
            cp ../prepared/latest.json .
          elif [ -f /tmp/latest.json.keep ]; then
            echo "Keeping existing latest.json"
            cp /tmp/latest.json.keep latest.json
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git pull origin gh-pages || true

          git add .
          git commit -m "Update latest build" || true
          git push
