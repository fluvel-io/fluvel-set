#
# Settings of scripts/run_clazy.sh (Clazy has no configuration file of its own).
# This file is read by bash, so keep the VAR="value" syntax.

# Checks to run, separated by commas.
#   level0   very reliable, almost no false positive
#   level1   reliable, few false positives (level0 included)
#   level2   more checks, more false positives (level1 included)
# A level can be completed with some checks, or some checks can be removed:
#   CLAZY_CHECKS="level1,qstring-allocations,no-old-style-connect"
CLAZY_CHECKS="level1"

# Regular expression of the paths for which no diagnostic is reported.
CLAZY_IGNORE_DIRS="build.*/|/Qt/|/usr/"
