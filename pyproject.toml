[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "fluvel-set"
dynamic = ["version"]
description = "Real-time computer vision and image analysis for research (level-set active contours)"
readme = "README.md"
requires-python = ">=3.11"
license = "CECILL-2.1"
license-files = ["Licence_CeCILL_V2.1-*.txt"]
authors = [{ name = "Fabien Bessy" }]
keywords = ["image processing", "segmentation", "active contour", "level set", "computer vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# Needed by the scripts of the examples/ directory to read and show images.
examples = ["opencv-python"]

[project.urls]
Homepage = "https://github.com/fluvel-io/fluvel-set"
Repository = "https://github.com/fluvel-io/fluvel-set"

# The version comes from the CMake project() line, so there is a single source.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(FluvelSet VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.22"
cmake.build-type = "Release"
# The wheel only contains the compiled "fluvel" module (no Python package).
wheel.packages = []

[tool.scikit-build.cmake.define]
FLUVEL_BUILD_APP = "OFF"
FLUVEL_BUILD_BIND = "ON"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = "pytest"
# importorskip would silently skip every test if the import failed: check it first.
test-command = "python -c \"import fluvel\" && pytest {project}/tests/python -q"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# The build runs in a container: give it the commit to record in the module.
environment-pass = ["GITHUB_SHA"]
manylinux-x86_64-image = "manylinux_2_34"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
# One wheel for Apple Silicon and Intel Macs (tested on the Apple Silicon runner).
archs = ["universal2"]
# The C++23 standard library needs a recent deployment target.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }
